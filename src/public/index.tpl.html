<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">
    <title>{{APPCORE_APP_NAME}}</title>
    <link rel="stylesheet" href="./app/styles/styles.css" />
    <script type="module" src="./app/js/Application.js"></script>
  </head>
  <body data-appcore-id="app.js.application" >
    <!--{{APPCORE_DEV_MODE_BADGE}}-->
    <!--{{APPCORE_APPLICATION_LOADER}}-->
     
    <!-- Main application, displayed once loading is complete -->
    <div class="application" style="display: none;">
      <header>
        <h1>
            <img class="logo" src="./assets/icons/icon-512.png" alt="">
            <span class="title">{{APPCORE_APP_NAME}}</span>
        </h1> 
        <div class="menu">
          <!-- You may add a menu here -->
        </div>
      </header>
      <main>

        <!-- Switchable container may contain multiple component -->
        <section data-appcore-id="app.js.stack-component::optional-uid">
            <section data-appcore-id="app.js.screen::screen-home-1">
              <div class="screen-content"> 
                <div>
                <h2>Congratulations!</h2>
                  <br>
                  <h3>Your application is up and running, ready to be built upon.</h3>
                  <p>
                      Visit the <a href="intro/">introduction page</a> to explore some of the framework's features.
                      You will find a sample menu, multiple screens, and examples of reusable components.
                  </p>
                </div>
                <div data-appcore-id="ext.map.leaflet.leaflet-map"
                    data-template="ext.map.leaflet.core-leaflet-map">
                    
                </div>
              </div>
          </section>
        </section>

      </main>
      <footer>
        <p>© AppCore<sub>JS</sub> - 2026 (DzzD)</p>      
      </footer>
    </div>
  </body>
</html>
