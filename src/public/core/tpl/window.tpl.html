<div data-template="app.tpl.window"
     data-appcore-class="app.js.window"
    >
    <div class="window-modal-overlay"></div>

    <div class="window-header">
        <div class="window-title">
            <span class="window-icon"></span>
            <h3 data-zone="title"></h3>
        </div>

        <button type="button" class="window-close" aria-label="Close"><span>x</span></button>
    </div>

    <div class="window-body" data-zone="body"></div>

    <div class="window-footer" data-zone="footer">
        <button type="button" class="window-confirm">OK</button>
    </div>
</div>
