 <div>
    <style>
        .dev-mode-badge
        {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 2.6rem;
            max-width: 2.6rem;
            height: 2.6rem;
            overflow: hidden;
            padding: 0.35rem;
            color: #ffffff;
            background: rgba(255, 85, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 0.5rem;
            box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.18);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.2;
            transition:
                width 0.25s ease,
                max-width 0.25s ease,
                gap 0.25s ease,
                padding 0.25s ease,
                background-color 0.25s ease,
                box-shadow 0.25s ease;
            
            min-width: 2.6rem;
            box-sizing: border-box;
        }

        .dev-mode-badge:hover,
        .dev-mode-badge:focus-within
        {
            width: auto;
            max-width: 28rem;
            height: auto;
            min-height: 3.2rem;
            gap: 0.75rem;
            padding: 0.65rem 0.9rem;
            background: rgba(255, 85, 0, 0.95);
            box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.25);
        }


        .dev-mode-badge svg
        {
            width: 1.6rem;
            height: 1.6rem;
            min-width: 1.6rem;
            display: block;
            flex: 0 0 1.6rem;
            fill: currentColor;
        }

        .dev-mode-badge span,
        .dev-mode-badge button
        {
            display: none;
            opacity: 0;
            transform: translateX(0.5rem);
            white-space: nowrap;
        }

        .dev-mode-badge:hover span,
        .dev-mode-badge:hover button,
        .dev-mode-badge:focus-within span,
        .dev-mode-badge:focus-within button
        {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        /* .dev-mode-badge span
        {
            display: block;
            line-height: 1.2;
        } */

        .dev-mode-badge button
        {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.14);
            color: inherit;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1;
            padding: 0.6rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
        }

        .dev-mode-badge button:hover
        {
            background: rgba(255, 255, 255, 0.22);
        }

        .dev-mode-help
        {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(20, 24, 31, 0.45);
            backdrop-filter: blur(2px);
        }

        .dev-mode-help.is-open
        {
            display: flex;
        }

        .dev-mode-help-dialog
        {
            width: min(32rem, 100%);
            padding: 1.25rem 1.25rem 1rem;
            color: #24364d;
            background: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.25);
        }

        .dev-mode-help-dialog h2
        {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
            line-height: 1.2;
        }

        .dev-mode-help-dialog p
        {
            margin: 0;
            line-height: 2;
        }

        .dev-mode-help-dialog ul
        {
            margin: 0 0 0.5rem 0;
            line-height: 2;
        }

        .dev-mode-help-dialog kbd
        {
            display: inline-block;
            padding: 0.15rem 0.45rem;
            font: inherit;
            line-height: 1.5;
            font-size: 0.92em;
            font-weight: 700;
            color: #24364d;
            background: #f3f6fa;
            border: 1px solid #d7dee8;
            border-radius: 0.35rem;
        }

        .dev-mode-help-actions
        {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .dev-mode-help-actions button
        {
            appearance: none;
            border: 0;
            background: #0175cd;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            padding: 0.7rem 1rem;
            border-radius: 0.45rem;
            cursor: pointer;
        }

        .dev-mode-help-actions button:hover
        {
            filter: brightness(1.05);
        }
    </style>

    <div class="dev-mode-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.25L1.82 20.25c-.39.69.11 1.55.9 1.55h18.56c.79 0 1.29-.86.9-1.55L12 2.25zm0 5.25c.41 0 .75.34.75.75v6a.75.75 0 01-1.5 0v-6c0-.41.34-.75.75-.75zm0 10.5a1.13 1.13 0 110-2.25A1.13 1.13 0 0112 18z"/>
        </svg>
        <span>Development mode active</span>
        <button type="button" data-dev-help-open>Browser DevTools</button>
    </div>

    <div class="dev-mode-help" data-dev-help>
        <div class="dev-mode-help-dialog" role="dialog" aria-modal="true" aria-labelledby="dev-mode-help-title">
            <h2 id="dev-mode-help-title">Open browser DevTools</h2>
            <p> Press <kbd>F12</kbd> to open the browser debugger.</p>
            <p> For Chrome users:</p>
            <ul>
                <li>Go to <kbd>Sources</kbd> &gt; <kbd>Workspace</kbd>.</li>
                <li>Click <kbd>Connect</kbd> to edit styles directly from Chrome.</li>
            </ul>
            <p>This only works when the site is running on <kbd>localhost</kbd>.</p>
            <div class="dev-mode-help-actions">
                <button type="button" data-dev-help-close>Close</button>
            </div>
        </div>
    </div>

    <script>
    (() =>
    {
        const popup = document.querySelector('[data-dev-help]');
        const openButton = document.querySelector('[data-dev-help-open]');
        const closeButton = document.querySelector('[data-dev-help-close]');

        openButton?.addEventListener('click', () =>
        {
            popup?.classList.add('is-open');
        });

        closeButton?.addEventListener('click', () =>
        {
            popup?.classList.remove('is-open');
        });

        popup?.addEventListener('click', (event) =>
        {
            if (event.target === popup)
            {
                popup.classList.remove('is-open');
            }
        });

        document.addEventListener('keydown', (event) =>
        {
            if (event.key === 'Escape')
            {
                popup?.classList.remove('is-open');
            }
        });
    })();
    </script>
</div>
